<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Заметки">

  <title>Мои заметки</title>
  <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <div class="header-inner">
        <h1 class="logo">📝 Мои заметки</h1>
        <span id="offline-badge" class="badge hidden">Офлайн</span>
      </div>
      <nav class="nav">
        <button id="home-btn" class="nav-btn active">Главная</button>
        <button id="about-btn" class="nav-btn">О приложении</button>
      </nav>
    </header>

    <main id="app-content" class="main">
      <div class="skeleton">
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    </main>

    <footer class="footer">
      <button id="enable-push" class="btn-push btn-push--on">🔔 Включить уведомления</button>
      <button id="disable-push" class="btn-push btn-push--off hidden">🔕 Отключить уведомления</button>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
